name: Node.js CI (Auto Test)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: 22
        cache: 'npm' 

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test